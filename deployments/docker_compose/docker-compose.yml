services:
  # --- Main Application Service ---
  aac-checkmk:
    image: "checkmk/check-mk-raw:2.4.0-daily"
    container_name: "aac-checkmk"
    hostname: "monitoring"
    restart: "unless-stopped"


    environment:
      PUID: "1000"
      OMD_SITE_ID: "cmk"
      TZ: "Europe/Berlin"
      PGID: "1000"
      CMK_SITE_NAME: "Feser-Monitoring"
      CMK_PASSWORD: "${CMK_PASSWORD:?set CMK_PASSWORD in .env (see .env.example)}"
    ports:
      - "8285:5000/tcp"
      - "8286:5001/tcp"
      - "8012:8000/tcp"

    volumes:
      - "/etc/localtime:/etc/localtime"
      - "/export/docker/aac-checkmk/sites:/omd/sites"

    networks:
      - exposed
      - interconnect
      - secured
      - stack_internal

    labels:
      traefik.enable: "true"
      traefik.http.routers.aac-checkmk.rule: "Host(`monitoring.example.com`)"
      traefik.http.routers.aac-checkmk.entrypoints: "websecure"
      traefik.http.routers.aac-checkmk.tls: "true"
      traefik.http.routers.aac-checkmk.tls.certresolver: "ionos"
      traefik.docker.network: "services-secured"
      traefik.http.services.aac-checkmk.loadbalancer.server.port: "5000"
      traefik.http.services.aac-checkmk.loadbalancer.server.scheme: "http"
      auto-dns.createWildcard.aac-checkmk: "false"
      auto-dns.customDNS.aac-checkmk: "true"
      auto-dns.customDOMAIN.aac-checkmk: "example.com"
      auto-dns.customHost.aac-checkmk: "monitoring"
      homepage.group: "Monitoring"
      homepage.name: "Checkmk"
      homepage.href: "https://monitoring.example.com"
      homepage.icon: "checkmk.png"
      homepage.description: "IT‑Monitoring Platform"


    tmpfs:
    - /opt/omd/sites/cmk_feser/tmp:uid=1000,gid=1000



networks:
  secured:
    name: "services-secured"
    external: true
  exposed:
    name: "services-exposed"
    external: true
  interconnect:
    name: "docker-default"
    external: true
  stack_internal:
    name: "aac-checkmk_stack_internal"
    driver: "bridge"

